version: 2
updates:
  # Weekly npm sweep across both workspaces (single lockfile at the root).
  # Minor and patch updates roll up into one PR; majors stay solo so each
  # gets its own CI gate and revert.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
